<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Meter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #ffeef4 0%, #ffd6e5 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 32px 24px;
      border-radius: 28px;
      box-shadow: 0 16px 40px rgba(255, 105, 135, 0.2);
      width: 100%;
      max-width: 380px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Tabs */
    .tab-container {
      display: flex;
      background: #fce4ec;
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 24px;
      width: 100%;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      background: transparent;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #b04b6c;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn.active {
      background: #ff4081;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(255, 64, 129, 0.35);
    }

    .subtitle {
      font-size: 0.95rem;
      color: #7d7d7d;
      font-weight: 500;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Emphasized Loved Person (Bigger & Significant) */
    .loved-name {
      font-size: 2.5rem;
      font-weight: 800;
      color: #ff2d55;
      text-shadow: 0 2px 8px rgba(255, 45, 85, 0.2);
      margin-bottom: 18px;
      line-height: 1.1;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Meter Counter */
    .counter-box {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 4px;
      margin: 12px 0 24px;
    }

    .count {
      font-size: 4rem;
      font-weight: 900;
      color: #2c3e50;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .unit {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ff4081;
    }

    /* Pump Button */
    .pump-btn {
      background: linear-gradient(135deg, #ff4081, #ff2d55);
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 45, 85, 0.35);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      touch-action: manipulation;
    }

    .pump-btn:active {
      transform: scale(0.95);
      box-shadow: 0 4px 12px rgba(255, 45, 85, 0.3);
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Two Switchable Tabs -->
    <div class="tab-container">
      <button class="tab-btn active" id="tab1" onclick="switchTab(1)">Darshan loves Aishu</button>
      <button class="tab-btn" id="tab2" onclick="switchTab(2)">Aishu loves Darshan</button>
    </div>

    <div class="subtitle" id="label-prefix">Darshan loves</div>
    
    <!-- Loved person: larger & highlighted -->
    <div class="loved-name" id="loved-person">Aishu</div>

    <div class="counter-box">
      <span class="count" id="score-display">4900</span>
      <span class="unit">%</span>
    </div>

    <button class="pump-btn" id="pump-button" onclick="pumpHeart()">Tap to pump ❤️</button>
  </div>

  <script>
    // Load saved scores from localStorage even if browser was completely closed
    const meterData = {
      1: {
        giver: "Darshan",
        receiver: "Aishu",
        score: parseInt(localStorage.getItem('score_tab1')) || 4900
      },
      2: {
        giver: "Aishu",
        receiver: "Darshan",
        score: parseInt(localStorage.getItem('score_tab2')) || 4000
      }
    };

    let activeTab = 1;

    function renderView() {
      const data = meterData[activeTab];
      document.getElementById('label-prefix').textContent = `${data.giver} loves`;
      document.getElementById('loved-person').textContent = data.receiver;
      document.getElementById('score-display').textContent = data.score;

      document.getElementById('tab1').classList.toggle('active', activeTab === 1);
      document.getElementById('tab2').classList.toggle('active', activeTab === 2);
    }

    function switchTab(tabIndex) {
      activeTab = tabIndex;
      renderView();
    }

    function pumpHeart() {
      // Increment score
      meterData[activeTab].score += 10;
      document.getElementById('score-display').textContent = meterData[activeTab].score;

      // Persist data locally so it stays saved across browser sessions
      localStorage.setItem('score_tab1', meterData[1].score);
      localStorage.setItem('score_tab2', meterData[2].score);

      // Small bounce animation on the loved name
      const nameEl = document.getElementById('loved-person');
      nameEl.style.transform = 'scale(1.12)';
      setTimeout(() => {
        nameEl.style.transform = 'scale(1)';
      }, 150);
    }

    // Initial render when page loads
    renderView();
  </script>
</body>
</html>
