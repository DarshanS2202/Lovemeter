<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Love Meter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #faf9f6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #2b2b2b;
    }
    .card {
      background: #ffffff;
      border: 1px solid #eae7e1;
      border-radius: 28px;
      padding: 40px 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #9a948d;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .name {
      font-size: 1.35rem;
      font-weight: 500;
      color: #383431;
      margin-bottom: 24px;
    }
    .score-container {
      position: relative;
      display: inline-block;
      margin-bottom: 32px;
    }
    .score {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #1e1b18;
      transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .unit {
      font-size: 1.5rem;
      font-weight: 500;
      color: #a8a29e;
      margin-left: 2px;
    }
    .btn {
      background: #ffffff;
      border: 1.5px solid #ebdcd5;
      color: #b05c51;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(176, 92, 81, 0.08);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease;
      touch-action: manipulation;
    }
    .btn:active {
      transform: scale(0.92);
      background-color: #fffaf9;
      box-shadow: 0 2px 8px rgba(176, 92, 81, 0.12);
    }
    .btn svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
    }
    .hint {
      margin-top: 14px;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      color: #b5afa7;
    }
    .pop {
      animation: pop 0.4s ease forwards;
    }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="label">Love Meter</div>
    <div class="name">Darshan</div>

    <div class="score-container">
      <span class="score" id="score">4900</span><span class="unit">%</span>
    </div>

    <button class="btn" id="pumpBtn" aria-label="Increase Love">
      <svg viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </button>
    <div class="hint">Tap to pump</div>
  </div>

  <script>
    const STORAGE_KEY = 'meter_darshan_val';
    const DEFAULT_VAL = 4900;

    let savedVal = localStorage.getItem(STORAGE_KEY);
    let currentScore = savedVal !== null ? parseInt(savedVal, 10) : DEFAULT_VAL;

    const scoreEl = document.getElementById('score');
    const pumpBtn = document.getElementById('pumpBtn');

    function updateDisplay() {
      scoreEl.textContent = currentScore.toLocaleString();
    }

    updateDisplay();

    pumpBtn.addEventListener('click', () => {
      currentScore += 10;
      localStorage.setItem(STORAGE_KEY, currentScore);
      updateDisplay();

      scoreEl.classList.remove('pop');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('pop');
    });
  </script>
</body>
</html>
